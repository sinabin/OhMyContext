name: OhMyContext public release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact non-placeholder semver to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: owncontext-public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-public:
    name: Build, sign, and verify Windows public release
    runs-on: windows-latest
    timeout-minutes: 90
    environment: owncontext-public-release
    steps:
      - name: Require a disposable GitHub-hosted Windows runner
        if: ${{ runner.environment != 'github-hosted' }}
        shell: pwsh
        run: throw 'This workflow may run only on a GitHub-hosted disposable windows-latest runner.'

      - name: Check out the tagged source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Use the supported Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          npm ci --no-audit --fund=false

      - name: Normalize the release version
        shell: pwsh
        env:
          RAW_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $releaseVersion = $env:RAW_RELEASE_VERSION.Trim()
          if ($releaseVersion.StartsWith('v')) {
            $releaseVersion = $releaseVersion.Substring(1)
          }
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release version must be a non-placeholder semver after removing an optional v prefix: $releaseVersion"
          }
          "OWNCONTEXT_RELEASE_VERSION=$releaseVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Decode the protected Authenticode certificate
        shell: pwsh
        env:
          OWNCONTEXT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OWNCONTEXT_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OWNCONTEXT_SIGNING_CERTIFICATE_BASE64)) {
            throw 'The protected Authenticode certificate secret is missing.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'owncontext-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:OWNCONTEXT_SIGNING_CERTIFICATE_BASE64))
          "OWNCONTEXT_SIGNING_CERTIFICATE_FILE=$certificatePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Decode the protected security attestation
        shell: pwsh
        env:
          OWNCONTEXT_SECURITY_ATTESTATION_BASE64: ${{ secrets.OWNCONTEXT_SECURITY_ATTESTATION_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OWNCONTEXT_SECURITY_ATTESTATION_BASE64)) {
            throw 'The protected security attestation secret is missing.'
          }
          $attestationPath = Join-Path $env:RUNNER_TEMP 'owncontext-security-attestation.json'
          try {
            [IO.File]::WriteAllBytes($attestationPath, [Convert]::FromBase64String($env:OWNCONTEXT_SECURITY_ATTESTATION_BASE64))
          } catch {
            throw 'The protected security attestation secret is not valid base64.'
          }
          "OWNCONTEXT_SECURITY_ATTESTATION_FILE=$attestationPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run source and protocol verification
        run: npm run check

      - name: Build the signed Windows x64 candidate
        shell: pwsh
        env:
          OWNCONTEXT_RELEASE_PROFILE: public
          OWNCONTEXT_PUBLIC_RELEASE_APPROVAL: "true"
          OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD }}
          OWNCONTEXT_TIMESTAMP_SERVER: ${{ vars.OWNCONTEXT_TIMESTAMP_SERVER }}
          OWNCONTEXT_UPDATE_URL: ${{ vars.OWNCONTEXT_UPDATE_URL }}
          OWNCONTEXT_SIGNING_WEBSITE: ${{ vars.OWNCONTEXT_SIGNING_WEBSITE }}
        run: npm run make --workspace @owncontext/desktop

      - name: Verify the source-bound release bundle and installed lifecycle
        shell: pwsh
        env:
          OWNCONTEXT_RELEASE_PROFILE: public
          OWNCONTEXT_PUBLIC_RELEASE_APPROVAL: "true"
          OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD }}
          OWNCONTEXT_TIMESTAMP_SERVER: ${{ vars.OWNCONTEXT_TIMESTAMP_SERVER }}
          OWNCONTEXT_UPDATE_URL: ${{ vars.OWNCONTEXT_UPDATE_URL }}
          OWNCONTEXT_SIGNING_WEBSITE: ${{ vars.OWNCONTEXT_SIGNING_WEBSITE }}
          OWNCONTEXT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OWNCONTEXT_RUNNER_LABEL: windows-latest
          OWNCONTEXT_DISPOSABLE_RUNNER_ACK: github-hosted-windows-latest-disposable
        run: |
          $builds = @(Get-ChildItem -LiteralPath apps/desktop/out -Directory -Filter 'public-*')
          if ($builds.Count -ne 1) { throw "Expected exactly one public build directory; found $($builds.Count)." }
          $buildDirectory = $builds[0].FullName
          npm run release:bundle:verify -- --build "$buildDirectory"
          & .github/scripts/Invoke-InstalledLifecycleSmoke.ps1 -BuildDirectory "$buildDirectory" -ExecuteDisposableGitHubHostedLifecycle

      - name: Finalize the source-bound public bundle
        shell: pwsh
        env:
          OWNCONTEXT_RELEASE_PROFILE: public
          OWNCONTEXT_PUBLIC_RELEASE_APPROVAL: "true"
          OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD }}
          OWNCONTEXT_TIMESTAMP_SERVER: ${{ vars.OWNCONTEXT_TIMESTAMP_SERVER }}
          OWNCONTEXT_UPDATE_URL: ${{ vars.OWNCONTEXT_UPDATE_URL }}
          OWNCONTEXT_SIGNING_WEBSITE: ${{ vars.OWNCONTEXT_SIGNING_WEBSITE }}
        run: |
          $build = Get-ChildItem -LiteralPath apps/desktop/out -Directory -Filter 'public-*' | Select-Object -First 1
          if ($null -eq $build) { throw 'Public build directory is missing.' }
          $cleanEvidence = Join-Path $build.FullName 'ci-evidence/WINDOWS-INSTALLED-LIFECYCLE-CI.json'
          if (-not (Test-Path -LiteralPath $cleanEvidence -PathType Leaf)) { throw 'Clean-machine evidence is missing.' }
          $env:OWNCONTEXT_CLEAN_MACHINE_EVIDENCE_FILE = $cleanEvidence
          "OWNCONTEXT_CLEAN_MACHINE_EVIDENCE_FILE=$cleanEvidence" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OWNCONTEXT_RELEASE_BUILD_DIRECTORY=$($build.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item -LiteralPath (Join-Path $build.FullName 'evidence/OWNCONTEXT-RELEASE-CANDIDATE.json') -Force
          Remove-Item -LiteralPath (Join-Path $build.FullName 'evidence/OWNCONTEXT-RELEASE-SHA256SUMS') -Force
          Remove-Item -LiteralPath (Join-Path $build.FullName 'evidence/SOURCE-package-lock.json') -Force
          npm run release:bundle:generate -- --build "$($build.FullName)"
          npm run release:bundle:verify -- --build "$($build.FullName)"

      - name: Run final release preflight after lifecycle evidence
        shell: pwsh
        env:
          OWNCONTEXT_RELEASE_PROFILE: public
          OWNCONTEXT_PUBLIC_RELEASE_APPROVAL: "true"
          OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OWNCONTEXT_SIGNING_CERTIFICATE_PASSWORD }}
          OWNCONTEXT_TIMESTAMP_SERVER: ${{ vars.OWNCONTEXT_TIMESTAMP_SERVER }}
          OWNCONTEXT_UPDATE_URL: ${{ vars.OWNCONTEXT_UPDATE_URL }}
          OWNCONTEXT_SIGNING_WEBSITE: ${{ vars.OWNCONTEXT_SIGNING_WEBSITE }}
        run: |
          $build = Get-ChildItem -LiteralPath apps/desktop/out -Directory -Filter 'public-*' | Select-Object -First 1
          if ($null -eq $build) { throw 'Public build directory is missing.' }
          node scripts/release-preflight.mjs --json

      - name: Publish the verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $build = Get-ChildItem -LiteralPath apps/desktop/out -Directory -Filter 'public-*' | Select-Object -First 1
          if ($null -eq $build) { throw 'Public build directory is missing.' }
          $assets = @(
            (Join-Path $build.FullName 'make/squirrel.windows/x64/*'),
            (Join-Path $build.FullName 'evidence/*'),
            (Join-Path $build.FullName 'ci-evidence/*')
          )
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --title "OhMyContext $env:GITHUB_REF_NAME" --notes-file (Join-Path $build.FullName 'evidence/RELEASE-NOTES.md')
