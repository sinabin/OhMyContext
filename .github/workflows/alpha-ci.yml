name: Windows alpha verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owncontext-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-alpha:
    name: Verify unsigned Windows alpha
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Fail before checkout/build if this label is ever attached to a
      # persistent runner. The installer step repeats this gate at runtime.
      - name: Require a disposable GitHub-hosted Windows runner
        if: ${{ runner.environment != 'github-hosted' }}
        shell: pwsh
        run: throw 'This workflow may run only on a GitHub-hosted disposable windows-latest runner.'

      - name: Check out the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use the supported Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Statically validate the installed-lifecycle safety boundary
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            & .github/scripts/Test-InstalledLifecycleSmokeStatic.ps1
          } catch {
            $detail = ($_ | Out-String).Trim()
            $annotation = ($detail -replace '\s+', ' ')
            if ($annotation.Length -gt 6000) { $annotation = $annotation.Substring($annotation.Length - 6000) }
            Write-Output "::error title=installed lifecycle static validation failed::$annotation"
            "Installed lifecycle static validation failure:" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $detail | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $detail | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'ohmycontext-static-validation.txt') -Encoding utf8
            throw
          }

      - name: Retain static validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ohmycontext-static-validation-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/ohmycontext-static-validation.txt

      - name: Install locked dependencies
        shell: pwsh
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          $log = npm ci --no-audit --fund=false 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            $detail = ($log.Trim() -replace '\s+', ' ')
            if ($detail.Length -gt 6000) { $detail = $detail.Substring($detail.Length - 6000) }
            Write-Output "::error title=npm ci failed::$detail"
            throw "npm ci failed on the GitHub-hosted runner."
          }

      - name: Run source and protocol verification
        run: npm run check

      - name: Build and verify the unsigned Windows alpha
        run: npm run make --workspace @owncontext/desktop

      - name: Locate the single clean-run build directory
        shell: pwsh
        run: |
          $builds = @(Get-ChildItem -LiteralPath apps/desktop/out -Directory -Filter 'unsigned-*')
          if ($builds.Count -ne 1) {
            throw "Expected exactly one unsigned alpha build directory; found $($builds.Count)."
          }
          "OWNCONTEXT_BUILD_DIR=$($builds[0].FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Re-verify the source-bound draft release bundle
        shell: pwsh
        run: npm run release:bundle:verify -- --build "$env:OWNCONTEXT_BUILD_DIR"

      - name: Exercise the actual installed Squirrel lifecycle
        if: ${{ runner.environment == 'github-hosted' }}
        shell: pwsh
        env:
          OWNCONTEXT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OWNCONTEXT_RUNNER_LABEL: windows-latest
          OWNCONTEXT_DISPOSABLE_RUNNER_ACK: github-hosted-windows-latest-disposable
        run: >-
          & .github/scripts/Invoke-InstalledLifecycleSmoke.ps1
          -BuildDirectory "$env:OWNCONTEXT_BUILD_DIR"
          -ExecuteDisposableGitHubHostedLifecycle

      # An unsigned executable must not become a downloadable artifact merely
      # because this verification workflow is later copied into a public repo.
      - name: Retain the private-repository alpha bundle briefly
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owncontext-unsigned-alpha-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ env.OWNCONTEXT_BUILD_DIR }}/make/squirrel.windows/x64/*
            ${{ env.OWNCONTEXT_BUILD_DIR }}/evidence/*
            ${{ env.OWNCONTEXT_BUILD_DIR }}/ci-evidence/*
            ${{ env.OWNCONTEXT_BUILD_DIR }}/OwnContext Developer Preview-win32-x64/resources/compliance/*
