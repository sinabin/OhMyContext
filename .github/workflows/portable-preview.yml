name: OhMyContext portable preview

on:
  push:
    tags:
      - "preview-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Unique GitHub release tag, for example preview-v0.1.0"
        required: true
        type: string
        default: preview-v0.1.0

permissions:
  contents: write

concurrency:
  group: ohmycontext-portable-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Build and publish Windows Portable ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Require a disposable GitHub-hosted Windows runner
        if: ${{ runner.environment != 'github-hosted' }}
        shell: pwsh
        run: throw 'This workflow may run only on a GitHub-hosted disposable windows-latest runner.'

      - name: Check out the source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use the supported Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          npm ci --no-audit --fund=false
          Push-Location node_modules/electron-winstaller
          try { node script/select-7z-arch.js } finally { Pop-Location }

      - name: Build and smoke-test the unsigned developer package
        run: npm run package:win --workspace @owncontext/desktop

      - name: Create the portable ZIP and checksum
        shell: pwsh
        run: |
          $builds = @(Get-ChildItem -LiteralPath apps/desktop/out -Directory -Filter 'unsigned-*')
          if ($builds.Count -ne 1) { throw "Expected exactly one unsigned build directory; found $($builds.Count)." }
          $portableDirectory = Join-Path $builds[0].FullName 'OhMyContext Developer Preview-win32-x64'
          if (-not (Test-Path -LiteralPath (Join-Path $portableDirectory 'OhMyContextDeveloperPreview.exe') -PathType Leaf)) {
            throw 'Portable executable is missing from the packaged directory.'
          }
          $tag = '${{ inputs.tag || github.ref_name }}'.Trim()
          if ($tag -notmatch '^preview-v[0-9A-Za-z.-]+$') { throw "Invalid preview tag: $tag" }
          $zipPath = Join-Path $env:RUNNER_TEMP 'OhMyContext-Portable-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $portableDirectory '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $env:RUNNER_TEMP 'OhMyContext-Portable-Windows-x64.sha256'
          "$hash  OhMyContext-Portable-Windows-x64.zip" | Out-File -LiteralPath $checksumPath -Encoding ascii
          "PREVIEW_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIEW_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIEW_CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish the unsigned portable preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:PREVIEW_TAG $env:PREVIEW_ZIP $env:PREVIEW_CHECKSUM `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "OhMyContext $env:PREVIEW_TAG (Portable Preview)" `
            --notes "Unsigned Windows x64 portable preview. Extract the ZIP and run OhMyContextDeveloperPreview.exe. This is not the signed public release."
